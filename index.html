<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <h1>Calculator</h1>
    <p class="subtitle">Simple. Smart. Accurate.</p>

    <div id="display" class="display" aria-live="polite">0</div>

    <div class="buttons">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="delete">DEL</button>
      <button data-operator="/" class="operator">÷</button>
      <button data-operator="*" class="operator">×</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button data-operator="-" class="operator">−</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button data-operator="+" class="operator">+</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button data-action="equals" class="equals">=</button>

      <button data-number="0" class="zero">0</button>
      <button data-action="decimal">.</button>
    </div>

    <p id="message" role="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
